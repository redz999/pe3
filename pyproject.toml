[project]
name = "pe3-generator"
version = "0.1.0"
description = "PE3 generator prototype"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.0",
]

[project.scripts]
pe3-generate = "pe3_generator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
